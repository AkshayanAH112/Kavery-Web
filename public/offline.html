<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Kavery Sports Club</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0909; color: #f8f4ef; font-family: system-ui, sans-serif; text-align: center; padding: 24px; }
      img { width: 120px; height: 120px; border-radius: 24px; }
      h1 { font-size: 1.75rem; margin: 24px 0 8px; }
      p { color: #bdb3b5; max-width: 30rem; line-height: 1.6; margin: 0 auto 6px; }
      button { margin-top: 24px; min-height: 48px; padding: 0 24px; border: 0; background: #fff200; color: #0b0909; font-weight: 700; font-size: 1rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Kavery Sports Club Icon" />
      <h1>You are offline</h1>
      <p>Kavery needs a connection for live scores. Try again when you are back online.</p>
      <p lang="ta">இணைய இணைப்பு இல்லை. இணைப்பு மீண்டதும் மீண்டும் முயலுங்கள்.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
